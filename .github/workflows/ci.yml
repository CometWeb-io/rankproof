name: CI

on:
  push:
    branches: [main]
  pull_request:

# Scans query other people's servers — CI never runs networked tests.
env:
  RANKPROOF_PERSIST_HISTORY: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency security audit (including web dependencies)
        run: npm audit --include=dev --audit-level=low

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Property tests, deeper (new seed per run; the seed is printed on failure)
        run: npm run test:fuzz
        env:
          RANKPROOF_FUZZ_SEED: ${{ github.run_id }}

      - name: API contract (TypeScript and Python reference clients)
        run: npm run test:clients

      - name: Verification benchmark
        run: npm run benchmark

      - name: Build
        run: npm run build

      - name: CLI responds
        run: node bin/rankproof.mjs help

      - name: CLI argument errors exit with code 2
        run: |
          set +e
          node bin/rankproof.mjs gap example.com
          test $? -eq 2

      - name: Scaffold tests
        run: npm run test:scaffold

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Verification benchmark, rendered mode
        run: npm run benchmark -- --render

      - name: Rendered verification tests
        run: node --experimental-strip-types --test src/lib/backlinks/render.test.ts

      - name: E2E smoke (UI)
        run: npm run test:e2e

      # Node refuses to strip types under node_modules, so shipping the .ts
      # sources breaks every command once the package is installed rather than
      # cloned. Install the real tarball, into a path with a space, and run it.
      - name: Packed CLI runs when installed
        run: |
          set -eu
          mkdir -p "/tmp/pack check"
          npm pack --pack-destination "/tmp/pack check"
          cd "/tmp/pack check"
          npm init -y >/dev/null
          npm install ./rankproof-*.tgz
          ./node_modules/.bin/rankproof version
          ./node_modules/.bin/rankproof help > /dev/null
          # Integrators get the contract fixtures and reference clients with the package.
          test -f node_modules/rankproof/contract/fixtures/verify-response.json
          (cd node_modules/rankproof/clients/python && python3 -m unittest -q)
          # Compiled engine loads every verify-side module.
          node -e 'for (const m of ["verify-run.server","verify-history.server","warc.server","render.server","observe"]) import("rankproof/dist/" + m + ".js").catch((e) => { console.error(m, e.message); process.exit(1); })'
